<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCDC · Workforce Knowledge Continuity Portal</title>
  <meta name="description" content="Expertise coverage, continuity risk, and knowledge-capture planning for the Gulf CDC workforce." />
  <link rel="preconnect" href="data:," />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="42" height="42" role="img" aria-label="GCDC logo">
          <defs>
            <linearGradient id="gcdcGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0D3269"/>
              <stop offset="1" stop-color="#03A3CF"/>
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="13" fill="url(#gcdcGrad)"/>
          <path d="M35 16.5 A12.5 12.5 0 1 0 35 31.5" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M30.5 21 A7 7 0 1 0 30.5 27" fill="none" stroke="#95DCEF" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="2.6" fill="#00902E"/>
        </svg>
      </span>
      <span class="topbar__titles">
        <span class="topbar__org">GCDC</span>
        <span class="topbar__sub">Knowledge Mapping Portal</span>
      </span>
    </div>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab is-active" data-view="overview">Overview</button>
      <button class="tab" data-view="holders">Critical Experts</button>
      <button class="tab" data-view="gaps">Knowledge Gaps</button>
      <button class="tab" data-view="interviews">Interview Plan</button>
      <button class="tab" data-view="matrix">Expertise Matrix</button>
      <button class="tab" data-view="mapping">Mapping</button>
    </nav>

    <button class="theme-toggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <span class="theme-toggle__icon" aria-hidden="true">◐</span>
    </button>
  </header>

  <main id="main" class="main">
    <!-- Views render here -->
    <section id="view-overview" class="view" aria-labelledby="tab-overview"></section>
    <section id="view-holders" class="view" hidden></section>
    <section id="view-gaps" class="view" hidden></section>
    <section id="view-interviews" class="view" hidden></section>
    <section id="view-matrix" class="view" hidden></section>
    <section id="view-mapping" class="view" hidden></section>
  </main>

  <footer class="footer">
    <span>GCDC · Gulf Center for Disease Prevention &amp; Control — Knowledge Continuity &amp; Succession Risk Assessment</span>
    <span class="footer__meta" id="footerMeta"></span>
  </footer>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GCDC · Workforce Knowledge Continuity Portal</title>
  <meta name="description" content="Expertise coverage, continuity risk, and knowledge-capture planning for the Gulf CDC workforce." />
  <link rel="preconnect" href="data:," />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="utilbar">
    <div class="utilbar__inner">
      <span class="utilbar__org">
        <span dir="rtl">المركز الخليجي للوقاية من الأمراض ومكافحتها</span>
        <span class="sep">·</span>
        <span>Gulf Center for Disease Prevention and Control</span>
      </span>
      <form class="site-search" role="search" onsubmit="return false">
        <span class="site-search__icon" aria-hidden="true">⌕</span>
        <input type="search" id="siteSearch" placeholder="Search this portal…" aria-label="Search this portal" />
      </form>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#overview" aria-label="GCDC — Gulf Center for Disease Prevention and Control · home">
        <img class="brand__logo" src="assets/img/gcdc-logo-white.svg" alt="GCDC" />
        <span class="brand__tag">Knowledge Mapping Portal</span>
      </a>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <button class="tab is-active" data-view="overview">Overview</button>
        <button class="tab" data-view="core">Core Expertise</button>
        <button class="tab" data-view="interviews">Interview Plan</button>
        <button class="tab" data-view="matrix">Expertise Matrix</button>
        <button class="tab" data-view="mapping">Mapping</button>
      </nav>

      <button class="theme-toggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle light or dark theme">
        <span class="theme-toggle__icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <main id="main" class="main">
    <!-- Views render here -->
    <section id="view-overview" class="view" aria-labelledby="tab-overview"></section>
    <section id="view-core" class="view" hidden></section>
    <section id="view-interviews" class="view" hidden></section>
    <section id="view-matrix" class="view" hidden></section>
    <section id="view-mapping" class="view" hidden></section>
  </main>

  <footer class="footer">
    <span>GCDC · Gulf Center for Disease Prevention &amp; Control — Knowledge Continuity &amp; Succession Risk Assessment</span>
    <span class="footer__meta" id="footerMeta"></span>
  </footer>

  <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

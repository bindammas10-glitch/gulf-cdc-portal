<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" role="img" aria-label="Knowledge Mapping">
  <defs>
    <linearGradient id="kmg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4dab"/>
      <stop offset="1" stop-color="#3f6ad8"/>
    </linearGradient>
  </defs>

  <!-- location pin outline -->
  <path d="M110 232 C 74 186 34 150 34 98 A 76 76 0 1 1 186 98 C 186 150 146 186 110 232 Z"
        fill="none" stroke="url(#kmg)" stroke-width="9" stroke-linejoin="round"/>

  <!-- network links -->
  <g stroke="#8fa7dd" stroke-width="3" fill="none">
    <path d="M110 34 L58 96 M110 34 L86 66 M110 34 L134 66 M110 34 L162 96"/>
    <path d="M58 96 L86 66 M134 66 L162 96"/>
    <path d="M86 66 L88 118 M134 66 L132 118"/>
    <path d="M58 96 L88 118 M162 96 L132 118"/>
  </g>
  <g stroke="#33508f" stroke-width="3.4" fill="none">
    <path d="M58 96 L110 196 M162 96 L110 196 M110 154 L110 196"/>
  </g>

  <!-- nodes -->
  <circle cx="110" cy="34"  r="12" fill="#2a4dab"/>
  <circle cx="58"  cy="96"  r="12" fill="#2a4dab"/>
  <circle cx="162" cy="96"  r="12" fill="#2a4dab"/>
  <circle cx="86"  cy="66"  r="9"  fill="#7b96d6"/>
  <circle cx="134" cy="66"  r="9"  fill="#7b96d6"/>
  <circle cx="88"  cy="118" r="9"  fill="#7b96d6"/>
  <circle cx="132" cy="118" r="9"  fill="#7b96d6"/>
  <circle cx="110" cy="196" r="12" fill="#33508f"/>

  <!-- person -->
  <g fill="url(#kmg)">
    <circle cx="110" cy="92" r="20"/>
    <path d="M74 154 A 36 34 0 0 1 146 154 L146 158 L74 158 Z"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="110" cy="243" rx="26" ry="5" fill="#c9d4ef"/>
</svg>

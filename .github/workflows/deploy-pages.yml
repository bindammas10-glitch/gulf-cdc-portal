name: Deploy to GitHub Pages

# Pages is published from the gh-pages branch (auto-enabled when that branch
# was created). This workflow keeps it in sync: every push to main is mirrored
# to gh-pages, which triggers GitHub's own "pages build and deployment".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        run: git push --force origin HEAD:gh-pages

name: Deploy to Azure Static Web Apps

# Publishes the Knowledge Mapping Page to Azure Static Web Apps on every push
# to main, so the normal edit → commit → live loop is preserved.
#
# One-time setup (see docs/AZURE_DEPLOYMENT.md):
#   Add the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN
#   (Settings → Secrets and variables → Actions → New repository secret)
#   with the deployment token from the Azure Static Web App.
#
# Until that secret exists this workflow runs and reports success without
# deploying, so it never shows a spurious failure. Note that the `secrets`
# context cannot be used in a job-level `if:`, hence the guard step below.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Check whether Azure is configured
        id: guard
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Azure not configured::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — skipping deployment. See docs/AZURE_DEPLOYMENT.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # The site is plain static HTML/CSS/JS — nothing to build.
          app_location: "/"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close staging environment
    steps:
      - name: Check whether Azure is configured
        id: guard
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close
        if: steps.guard.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
